<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy 6 Months Together ❤️</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #120320 0%, #2b0938 50%, #5c1349 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 16px;
      overflow-x: hidden;
    }
    .wrapper {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      width: 100%;
      max-width: 390px;
      padding: 26px 20px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      color: #ff9ebb;
      margin-bottom: 12px;
    }
    .slide { display: none; animation: slideFade 0.5s ease-out; }
    .slide.active { display: block; }
    @keyframes slideFade {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h2 { font-size: 24px; color: #ff70a6; margin-bottom: 8px; font-weight: 700; }
    p { font-size: 13.5px; line-height: 1.6; color: #e6e6e6; margin-bottom: 18px; }
    
    .btn {
      background: linear-gradient(45deg, #ff4081, #d81b60);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(216, 27, 96, 0.35);
      margin-top: 10px;
      transition: transform 0.2s;
    }
    .btn:active { transform: scale(0.96); }

    /* Counter Grid */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }
    .stat-box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 10px;
      border-radius: 14px;
    }
